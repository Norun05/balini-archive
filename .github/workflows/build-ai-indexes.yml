name: Build AI indexes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ai]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build AI indexes
        run: |
          python tools/build_recent20_indexes.py
          python tools/build_metrics20.py
          python tools/build_role_matchup_index.py
          python tools/find_senna_yasuo.py

      - name: Commit generated indexes
        run: |
          if git diff --quiet -- data/ai && [ -z "$(git status --porcelain data/ai)" ]; then
            echo "No AI index changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai
          git commit -m "[skip ai] Update AI indexes"
          git push
